name: Backend checks
on:
  push:
    paths: ['backend/**', 'frontend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PDF_FONT_PATH: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm test
      - run: npm run openapi
      - run: git diff --exit-code -- contracts/openapi.json
      - run: docker compose config --quiet
  release-ui:
    runs-on: ubuntu-latest
    env:
      PDF_FONT_PATH: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
